<html lang="en">
<head>

<meta name="robots" content="noindex, nofollow">
<title>Hello, World! Colour all 195 flags</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --sky:#CDE6F7; --paper:#FFFDF6; --surface:#FFFFFF; --ink:#1E3F8A; --text:#253049; --muted:#5B6782; --line:#D9E3F0;
  --green:#4FA545; --hill-a:#F4BC34; --hill-b:#5DAA4E;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --sky:#16294F; --paper:#0F1C38; --surface:#172A50; --ink:#BFD6FF; --text:#E7EEFB; --muted:#A4B3D1; --line:#2A3F69; --hill-a:#C7972A; --hill-b:#3F8237; color-scheme: dark; }
}
:root[data-theme="dark"]{ --sky:#16294F; --paper:#0F1C38; --surface:#172A50; --ink:#BFD6FF; --text:#E7EEFB; --muted:#A4B3D1; --line:#2A3F69; --hill-a:#C7972A; --hill-b:#3F8237; color-scheme: dark; }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ margin:0; background:var(--paper); color:var(--text); font-family:"Nunito","Segoe UI",system-ui,sans-serif; line-height:1.5; }
h1,h2{ font-family:"Fredoka","Nunito",system-ui,sans-serif; color:var(--ink); margin:0; font-weight:600; line-height:1.1; }
button,select{ font:inherit; }
:focus-visible{ outline:3px solid #2F6FD6; outline-offset:3px; border-radius:6px; }
.wrap{ width:min(1100px, 100% - 2rem); margin-inline:auto; }

.top{ background:var(--sky); padding:1.1rem 0 1.2rem; }
.top .wrap{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.8rem 1.5rem; }
.brand{ font:600 1.6rem/1 "Fredoka",sans-serif; color:var(--ink); }
.brand span{ display:block; font:700 .95rem/1.3 "Nunito",sans-serif; color:var(--muted); margin-top:.3rem; }
.progress{ font:500 1.05rem "Fredoka",sans-serif; color:var(--ink); background:var(--surface); border:2px solid var(--line); padding:.45rem .9rem; border-radius:999px; white-space:nowrap; }

.bar{ display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin:1.4rem 0 1rem; }
.bar select{ flex:1 1 240px; min-width:0; padding:.7rem .9rem; border-radius:12px; border:2px solid var(--line); background:var(--surface); color:var(--text); font-weight:700; }
.pill{ font:500 1.02rem "Fredoka",sans-serif; padding:.65rem 1.05rem; border-radius:999px; border:2px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; }
.pill.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

.sheet{ background:#fff; color:#253049; border-radius:12px; padding:1.2rem 1.2rem 1.4rem; box-shadow:0 2px 0 var(--line), 0 18px 40px rgba(20,40,80,.12); }
.head{ display:flex; justify-content:space-between; gap:1rem; align-items:flex-start; }
.count{ font:700 .78rem/1 "Nunito",sans-serif; letter-spacing:.14em; color:#7A8399; }
.cname{ font:600 clamp(1.7rem,4.5vw,2.4rem)/1.05 "Fredoka",sans-serif; color:#1A1A1A; margin-top:.35rem; }
.arname{ font:700 1.3rem/1.4 "Noto Sans Arabic",sans-serif; color:#1E3F8A; margin-top:.2rem; text-align:left; }
.ref{ width:110px; flex:none; text-align:center; font:700 .62rem/1.2 "Nunito",sans-serif; color:#E4473C; letter-spacing:.06em; }
.ref img{ width:110px; height:auto; display:block; border:1px solid #E3E7EF; margin-bottom:.3rem; background:#fff; }
.canvaswrap{ position:relative; margin-top:1rem; touch-action:none; -webkit-user-select:none; user-select:none; }
.canvaswrap canvas{ display:block; width:100%; height:auto; background:#fff; cursor:crosshair; touch-action:none; }
.canvaswrap svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.canvaswrap svg text{ font:700 26px "Nunito",sans-serif; fill:#8A93A6; letter-spacing:.05em; }
.loading{ display:grid; place-content:center; aspect-ratio:3/2; color:#7A8399; font-weight:700; }
.crayons{ display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; margin-top:1.1rem; }
.crayon{ width:2.9rem; height:2.9rem; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px #CBD3E2; cursor:pointer; padding:0; }
.crayon[aria-pressed="true"]{ box-shadow:0 0 0 3px #1E3F8A; transform:scale(1.08); }
.eraser{ display:inline-flex; align-items:center; gap:.4rem; height:2.9rem; padding:0 1rem 0 .75rem; border-radius:999px; border:2px solid #CBD3E2; background:#fff; color:#253049; font:500 1rem "Fredoka",sans-serif; cursor:pointer; }
.eraser svg{ width:1.5rem; height:1.5rem; }
.eraser[aria-pressed="true"]{ border-color:#1E3F8A; box-shadow:0 0 0 2px #1E3F8A; }
.clabel{ font:800 .95rem "Nunito",sans-serif; color:#5B6782; margin-left:.2rem; }
.under{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.8rem; margin-top:1rem; }
.status{ font:500 1.15rem "Fredoka",sans-serif; color:var(--ink); min-height:1.5em; }
.status.win{ color:var(--green); }
.ghost{ background:none; border:0; color:var(--muted); font:700 .95rem "Nunito",sans-serif; text-decoration:underline; text-underline-offset:4px; cursor:pointer; padding:0; }
.foot{ margin:2.5rem 0 0; background:var(--sky); padding:2rem 0 3rem; text-align:center; color:var(--muted); }
.foot a{ color:var(--ink); font-weight:800; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">Hello, World! <span>Colour all 195 flags · لوّن كل أعلام العالم</span></div>
    <div class="progress" id="progress" aria-live="polite">⭐ 0 of 195 coloured</div>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <label for="pick" class="sr" style="position:absolute;left:-9999px">Choose a country</label>
    <select id="pick"></select>
    <button class="pill" id="prev" aria-label="Previous country">Back</button>
    <button class="pill primary" id="next" aria-label="Next country">Next</button>
    <button class="pill" id="random">Surprise me 🎲</button>
  </div>

  <section class="sheet" aria-labelledby="cname">
    <div class="head">
      <div><div class="count" id="count"></div><h1 class="cname" id="cname"></h1><div class="arname" id="arname" dir="rtl" lang="ar"></div></div>
      <div class="ref"><img id="refimg" alt=""><span>The real flag</span></div>
    </div>
    <div class="canvaswrap" id="board"><div class="loading">Loading the flag…</div></div>
    <div class="crayons" id="crayons" role="group" aria-label="Crayons"></div>
    <div class="under">
      <p class="status" id="status" aria-live="polite">Pick a crayon and start colouring.</p>
      <button class="ghost" id="reset">Start this flag again</button>
    </div>
  </section>
</main>

<footer class="foot">
  <p>Colour with your finger, a mouse or an Apple Pencil. Your stars are saved on this device.</p>
  <p>Hello, World! · <a href="https://jennyelakoury.github.io/theworldbookk/">The world book for any age</a></p>
</footer>

function showProgress(){ const d = getDone(); document.getElementById('progress').textContent = `⭐ ${d.size} of 195 coloured`;

function loadPart(p){

async function show(i, push){

  const [n, name, ar, part] = INDEX[cur];

  const lab = document.createElement('span'); lab.className = 'clabel'; lab.id = 'clabel'; box.appendChild(lab);

}
function choose(c){
  pick = c;
  document.querySelectorAll('.crayon, .eraser').forEach(b => b.setAttribute('aria-pressed', b.title === c.toLowerCase()));
  const l = document.getElementById('clabel'); if (l) l.textContent = c.charAt(0) + c.slice(1).toLowerCase();
}

function pos(e){ const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * cv.width, y:(e.clientY - r.top) / r.height * cv.height, p: e.pointerType === 'pen' ? Math.max(.15, e.pressure || .5) : .55 }; }
function line(a, b){
  const c = flag.clip; ctx.save(); ctx.beginPath(); ctx.rect(c[0]*cv.width, c[1]*cv.height, (c[2]-c[0])*cv.width, (c[3]-c[1])*cv.height); ctx.clip();
  const erase = pick === 'ERASER';
  ctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  ctx.strokeStyle = erase ? '#000' : PAL[pick]; ctx.lineWidth = (erase ? 46 : pick === 'WHITE' ? 40 : 30) * (cv.width / 1200) * (0.55 + b.p);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.restore(); ctx.globalCompositeOperation = 'source-over';
}
function down(e){ if (!pick) return; e.preventDefault(); drawing = true; last = pos(e); try { cv.setPointerCapture(e.pointerId); } catch(_){} line(last, last); }
function move(e){ if (!drawing) return; e.preventDefault(); const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  (evs.length ? evs : [e]).forEach(ev => { const p = pos(ev); line(last, p); last = p; }); }
function up(){ if (!drawing) return; drawing = false; last = null; clearTimeout(timer); timer = setTimeout(check, 250); }

function rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function check(){
  if (!flag) return;
  const data = ctx.getImageData(0, 0, cv.width, cv.height).data, cols = flag.cols, P = cols.map(c => rgb(PAL[c]));
  let need = 0, covered = 0, right = 0, whiteCells = 0, whiteSpoiled = 0, any = false; const per = {};
  for (let gy = 0; gy < flag.gh; gy++) for (let gx = 0; gx < flag.gw; gx++){
    const ch = flag.grid[gy * flag.gw + gx]; if (ch === '.') continue;
    const want = cols[+ch], x = Math.floor((gx + .5) / flag.gw * cv.width), y = Math.floor((gy + .5) / flag.gh * cv.height);
    const i = (y * cv.width + x) * 4, a = data[i+3], r = data[i], g = data[i+1], b = data[i+2];
    const blank = a < 40 || (r > 235 && g > 235 && b > 235);
    let got = null;
    if (!blank){ any = true; let bd = 1e9; cols.forEach((c, k) => { if (c === 'WHITE') return; const d = (r-P[k][0])**2 + (g-P[k][1])**2 + (b-P[k][2])**2; if (d < bd){ bd = d; got = c; } }); }
    if (want === 'WHITE'){ whiteCells++; if (got) whiteSpoiled++; continue; }
    need++; per[want] = per[want] || [0,0]; per[want][0]++; if (got){ covered++; per[want][1]++; if (got === want) right++; }
  }
  if (!any) return setStatus('Pick a crayon and start colouring.');
  const cover = need ? covered / need : 1, match = covered ? right / covered : 1, spoil = whiteCells ? whiteSpoiled / whiteCells : 0;
  const missing = Object.values(per).some(([t, c]) => t >= 3 && c / t < .5);
  if (cover < .65 || missing) return setStatus('Keep going, you’re doing great.');
  if (match >= .72 && spoil <= .3){ setStatus(`You coloured ${INDEX[cur][1]}! 🎉`, true); addDone(INDEX[cur][0]); }
  else setStatus('Almost! Check the real flag in the corner.');
}

const sel = document.getElementById('pick');
INDEX.forEach((c, i) => { const o = document.createElement('option'); o.value = i; o.textContent = `${c[0]}. ${c[1]}`; sel.appendChild(o); });
sel.addEventListener('change', () => show(+sel.value));
document.getElementById('prev').addEventListener('click', () => show(cur - 1));
document.getElementById('next').addEventListener('click', () => show(cur + 1));
document.getElementById('random').addEventListener('click', () => show(Math.floor(Math.random() * INDEX.length)));
document.getElementById('reset').addEventListener('click', () => show(cur, false));
function fromHash(){ const h = location.hash.slice(1); const i = INDEX.findIndex(c => slug(c[1]) === h); return i >= 0 ? i : 0; }
window.addEventListener('hashchange', () => { const i = fromHash(); if (i !== cur) show(i, false); });
showProgress(); show(fromHash(), false);
</script>
</body>
</html>
